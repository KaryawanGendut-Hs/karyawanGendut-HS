<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>ROBOTIC CORE v4.2 — FULL_INTEGRATED</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-gold: #ffcf00;
      --neon-red: #ff0055;
      --neon-purple: #bc13fe;
      --deep-bg: #03080e;
      --panel-glass: rgba(10, 25, 41, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }

    body {
      font-family: 'Orbitron', sans-serif;
      background: var(--deep-bg);
      background-image: 
        radial-gradient(circle at center, #0a1e33 0%, #03080e 100%),
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px;
    }

    .ticker-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 30px;
      background: rgba(0, 243, 255, 0.1); border-bottom: 1px solid var(--neon-cyan);
      overflow: hidden; z-index: 1000; display: flex; align-items: center;
    }

    .ticker {
      display: inline-block; white-space: nowrap; padding-right: 100%;
      animation: ticker 25s linear infinite;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--neon-cyan);
      text-transform: uppercase; letter-spacing: 2px;
    }

    @keyframes ticker {
      0% { transform: translate3d(100%, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .robot-container {
      width: 100%; max-width: 800px;
      background: var(--panel-glass);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 40px; position: relative;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
      margin-top: 40px;
    }

    .status-panel {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px 20px; margin-bottom: 25px;
      border-left: 4px solid var(--neon-cyan);
    }

    .status-dot { width: 10px; height: 10px; border-radius: 2px; animation: pulse 1.5s infinite; background: var(--neon-cyan); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    header h1 { font-size: 16px; letter-spacing: 4px; margin-bottom: 20px; color: var(--neon-cyan); }
    label { font-size: 10px; color: var(--neon-gold); margin-bottom: 8px; display: block; font-weight: bold; }

    textarea, input {
      width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1);
      padding: 12px; color: #fff; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; outline: none; margin-bottom: 15px;
    }

    .paste-zone {
      border: 2px dashed rgba(0, 243, 255, 0.4);
      padding: 20px; margin-bottom: 15px;
      text-align: center; background: rgba(0, 243, 255, 0.02);
      transition: 0.3s;
    }
    .preview-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .preview-item { width: 80px; height: 80px; border: 1px solid var(--neon-cyan); object-fit: cover; border-radius: 4px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    #extraInputs { display: none; padding: 15px; background: rgba(255,255,255,0.03); margin-bottom: 15px; }

    .btn-cyber {
      width: 100%; padding: 16px; border: 1px solid var(--neon-cyan);
      background: rgba(0, 243, 255, 0.05); color: var(--neon-cyan);
      font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px; font-size: 11px;
    }
    .btn-cyber:hover { background: var(--neon-cyan); color: #000; }

    .output-box { margin-top: 20px; border: 1px dashed rgba(255,255,255,0.2); padding: 20px; background: rgba(0, 0, 0, 0.4); }
    #outputText { font-family: 'JetBrains Mono'; font-size: 13px; color: #fff; white-space: pre-wrap; line-height: 1.6; }

    .mode-locked { border-color: var(--neon-red) !important; }
    .mode-ganti { border-color: var(--neon-cyan) !important; }
    .mode-dual { border-color: var(--neon-purple) !important; }
  </style>
</head>
<body onpaste="handlePaste(event)">

<div class="ticker-wrap">
  <div class="ticker">
    PASTE MODE: LANGSUNG TEKAN CTRL+V UNTUK UPLOAD GAMBAR (MAKSIMAL 3) — CORE v4.2
  </div>
</div>

<div class="robot-container" id="mainFrame">
  <div class="status-panel" id="statusBar">
    <div class="status-indicator" style="display:flex; align-items:center; gap:10px;">
      <div class="status-dot" id="dot"></div>
      <span id="systemText" style="font-size: 12px;">CORE_IDLE</span>
    </div>
    <div id="modeTag" style="font-size: 10px; font-weight: 900;">READY</div>
  </div>

  <header><h1>UNIT_PROCESSOR_v4.2</h1></header>

  <label>// LOG_DATA_STREAM</label>
  <textarea id="rawInput" placeholder="Tempel log teks di sini..." oninput="analyzeLog()" rows="4"></textarea>

  <label>// IMAGE_PASTE_ZONE (PASTE CTRL+V)</label>
  <div class="paste-zone">
    <span style="font-size: 10px; opacity: 0.6;">Tekan <b>CTRL+V</b> untuk menambah gambar (Maks 3)</span>
    <div id="loadingImg" style="display:none; color:var(--neon-gold); font-size: 10px; margin-top: 10px;">UPLOADING...</div>
    <div class="preview-container" id="previewBox"></div>
  </div>

  <div id="extraInputs"></div>

  <div class="grid">
    <div>
      <label>PRIMARY_STAFF</label>
      <input type="text" id="staffName" value="vknaacs6/Rizky Nadila" style="color:var(--neon-gold);">
    </div>
    <div>
      <label>REPORT_DATE</label>
      <input type="text" id="reportDate">
    </div>
  </div>

  <button class="btn-cyber" onclick="processReport()">[ EXECUTE_SEQUENCE ]</button>
  <button class="btn-cyber" onclick="copyResult()" style="border-color:var(--neon-gold); color:var(--neon-gold); margin-top: 10px;">[ COPY_TO_BUFFER ]</button>
  <button class="btn-cyber" onclick="resetImages()" style="border-color:var(--neon-red); color:var(--neon-red); margin-top: 10px; padding: 5px; font-size: 8px;">[ CLEAR_IMAGES ]</button>

  <div class="output-box">
    <div id="outputText">SYSTEM_AWAITING_INPUT...</div>
  </div>
</div>

<script>
let currentMode = "standby";
let uploadedLinks = [];

window.onload = function() {
    const now = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('reportDate').value = now.toLocaleDateString('id-ID', options);
};

// --- LOGIKA PASTE GAMBAR YANG DIOPTIMALKAN ---
async function handlePaste(e) {
    const items = e.clipboardData.items;
    const imageItems = Array.from(items).filter(item => item.type.indexOf("image") !== -1);
    
    if (imageItems.length === 0) return;

    if (uploadedLinks.length + imageItems.length > 3) {
        alert("Maksimal 3 gambar!");
        return;
    }

    for (let item of imageItems) {
        const blob = item.getAsFile();
        if (blob) await uploadToImgur(blob);
    }
}

async function uploadToImgur(blob) {
    const loading = document.getElementById('loadingImg');
    const previewBox = document.getElementById('previewBox');
    const sysText = document.getElementById('systemText');

    loading.style.display = "block";
    sysText.innerText = "UPLOADING...";

    const formData = new FormData();
    formData.append('image', blob);

    try {
        const response = await fetch('https://api.imgur.com/3/image', {
            method: 'POST',
            headers: { Authorization: 'Client-ID 23f5b08495bc20c' },
            body: formData
        });
        const data = await response.json();
        if (data.success) {
            const link = data.data.link;
            uploadedLinks.push(link);
            
            const img = document.createElement('img');
            img.src = link;
            img.className = 'preview-item';
            previewBox.appendChild(img);
            
            sysText.innerText = `READY (${uploadedLinks.length}/3)`;
        }
    } catch (err) {
        sysText.innerText = "UPLOAD_FAILED";
    } finally {
        loading.style.display = "none";
    }
}

function resetImages() {
    uploadedLinks = [];
    document.getElementById('previewBox').innerHTML = "";
    document.getElementById('systemText').innerText = "CLEARED";
}

// --- LOGIKA ANALISIS ORIGINAL ---
function analyzeLog() {
    const log = document.getElementById('rawInput').value;
    const frame = document.getElementById('mainFrame');
    const sysText = document.getElementById('systemText');
    const modeTag = document.getElementById('modeTag');
    const extras = document.getElementById('extraInputs');

    extras.style.display = "none";
    extras.innerHTML = "";

    const idMatches = [...log.matchAll(/change user info\s+([a-zA-Z0-9_]+)/gi)].map(m => m[1]);
    const uniqueIDs = [...new Set(idMatches)];

    if (uniqueIDs.length >= 2 || log.toLowerCase().includes("memiliki 2 user id")) {
        currentMode = "dual_id";
        frame.className = "robot-container mode-dual";
        sysText.innerText = "DUAL_ID_DETECTED";
        modeTag.innerText = "MODE: DUAL_ID";
        extras.style.display = "block";
        extras.innerHTML = `<div class="grid"><div><label>ID_ACTIVE</label><input type="text" id="idActive" value="${uniqueIDs[0]||''}"></div><div><label>ID_LOCKED</label><input type="text" id="idLocked" value="${uniqueIDs[1]||''}"></div></div>`;
    } 
    else if (log.toLowerCase().includes("locked")) {
        currentMode = "locked";
        frame.className = "robot-container mode-locked";
        sysText.innerText = "SECURITY_LOCKED";
        modeTag.innerText = "MODE: LOCKED";
        extras.style.display = "block";
        extras.innerHTML = `<div class="grid"><div><label>LOCK_REASON</label><input type="text" id="lockReason" placeholder="Invest 4d"></div><div><label>DEPO_VAL</label><input type="text" id="depoVal" placeholder="50.000"></div><input type="hidden" id="singleID" value="${uniqueIDs[0] || ''}"></div>`;
    }
    else if (log.toLowerCase().includes("bank") || log.toLowerCase().includes("rek")) {
        currentMode = "ganti_data";
        frame.className = "robot-container mode-ganti";
        sysText.innerText = "DATA_SYNC";
        modeTag.innerText = "MODE: GANTI_DATA";
        extras.style.display = "block";
        extras.innerHTML = `<label>TARGET_ID</label><input type="text" id="singleID" value="${uniqueIDs[0] || ''}">`;
    }
}

// --- LOGIKA OUTPUT ORIGINAL ---
function processReport() {
    const staff = document.getElementById('staffName').value;
    const tgl = document.getElementById('reportDate').value;
    let out = "";

    if (currentMode === "dual_id") {
        const idL = document.getElementById('idLocked').value;
        const idA = document.getElementById('idActive').value;
        out = `staff ${staff}\nTanggal : ${tgl}\nUser id : ${idA} dan ${idL}\n\nKeterangan : Terdaftar 2 user id dan untuk user id ${idL} di locked karenakan member memilih menggunakan user id ${idA} ya ko`;
    } 
    else if (currentMode === "locked") {
        const id = document.getElementById('singleID').value;
        const reason = document.getElementById('lockReason').value || "Invest 4d";
        const depo = document.getElementById('depoVal').value || "xxxx";
        out = `Staff : ${staff}\nTanggal : ${tgl}\nUser ID : ${id}\nKeterangan : Ada melakukan lock dengan keterangan ${reason} dan manual deposit sebesar Rp.${depo} agar tidak menjadi Pl pasive ya.`;
    } 
    else if (currentMode === "ganti_data") {
        const id = document.getElementById('singleID').value;
        const log = document.getElementById('rawInput').value;
        const bMatch = log.match(/bank\s*:\s*([^=>\s,]+)\s*=>\s*([^=>\s,]+)/i);
        const nMatch = log.match(/acc\s*:\s*([^=>]+)\s*=>\s*([^,]+)/i);
        const rMatch = log.match(/rek\s*:\s*(\d+)\s*=>\s*(\d+)/);
        out = `Staff : ${staff}\nTanggal : ${tgl}\nUser ID : ${id}\nKeterangan : Pergantian Data Rekening\n\nData sebelum : ${bMatch?bMatch[1]:'-'},${nMatch?nMatch[1].trim():'-'},${rMatch?rMatch[1]:'-'}\nData setelah : ${bMatch?bMatch[2]:'-'},${nMatch?nMatch[2].trim():'-'},${rMatch?rMatch[2]:'-'}`;
    }

    if (uploadedLinks.length > 0) {
        out += "\n\n" + uploadedLinks.join("\n");
    }

    document.getElementById('outputText').innerText = out || "SYSTEM_ERROR";
}

function copyResult() {
    const text = document.getElementById('outputText').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const originalText = document.getElementById('systemText').innerText;
        document.getElementById('systemText').innerText = "COPIED!";
        setTimeout(() => document.getElementById('systemText').innerText = originalText, 1500);
    });
}
</script>
</body>
</html>
